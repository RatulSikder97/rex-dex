# REX desktop packaging. Run via `npm run desktop:build` (stages the Next.js
# standalone engine into desktop/stage/server first).
#
# Signing / notarization are picked up from the environment when present:
#   macOS:   CSC_LINK + CSC_KEY_PASSWORD (Developer ID .p12) or CSC_NAME (keychain identity)
#            notarize: APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER
#                      or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
#   Windows: CSC_LINK + CSC_KEY_PASSWORD (or WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD)
# Without them the build is unsigned (ad-hoc on macOS) — fine for local testing.
appId: com.rex.workbench
productName: REX
copyright: Copyright © 2026 REX
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  app: desktop/app
  output: dist
  buildResources: desktop/build

asar: true
# The app dir has no dependencies; the engine's native modules (better-sqlite3,
# node-pty, @resvg/resvg-js) are N-API prebuilds checked under Electron's Node by
# desktop/scripts/stage.mjs, so nothing is collected or rebuilt here.
beforeBuild: desktop/scripts/before-build.cjs
nodeGypRebuild: false

extraResources:
  - from: desktop/stage/server
    to: server
    filter: ["**/*"]
  # electron-builder drops node_modules from file sets unless it is the `from` root itself.
  - from: desktop/stage/server/node_modules
    to: server/node_modules
    filter: ["**/*"]

afterSign: desktop/scripts/after-sign.cjs

mac:
  category: public.app-category.developer-tools
  icon: desktop/build/icon.icns
  # Arch comes from the CLI (desktop/scripts/build.mjs): host by default, REX_DESKTOP_ARCH=all → arm64 + x64.
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: REX automates Finder and creative apps (Premiere, After Effects) when you ask it to.
    NSDesktopFolderUsageDescription: REX opens project folders you choose.
    NSDocumentsFolderUsageDescription: REX opens project folders you choose.
    NSDownloadsFolderUsageDescription: REX opens project folders you choose.

dmg:
  title: ${productName} ${version}

win:
  icon: desktop/build/icon.ico
  target: [nsis]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: REX

linux:
  icon: desktop/build/icon.png
  category: Development
  synopsis: One-person company operating system
  target: [AppImage]
