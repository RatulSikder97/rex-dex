<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>REX</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0d12; color: #f5f3ee; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-app-region: drag; cursor: default; overflow: hidden; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      svg { width: 88px; height: 88px; filter: drop-shadow(0 10px 28px rgba(255, 77, 46, 0.22)); animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
      p { margin: -10px 0 0; color: rgba(245, 243, 238, 0.55); font-size: 12px; }
      .bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(245, 243, 238, 0.1); overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #ff4d2e; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { svg { animation: none; } .bar::after { animation: none; width: 100%; opacity: 0.6; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <svg viewBox="0 0 256 256" aria-hidden="true">
        <rect width="256" height="256" rx="56" fill="#161a22" />
        <path d="M68 52H150A48 48 0 0 1 150 148H108V200H68Z M108 86V114H148A14 14 0 0 0 148 86Z" fill="#F5F3EE" fill-rule="evenodd" />
        <path d="M120 148H164L196 200H152Z" fill="#FF4D2E" />
      </svg>
      <h1>REX</h1>
      <p>Starting the engine…</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
